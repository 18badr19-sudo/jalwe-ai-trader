name: Scanner tests
on: [push, pull_request]
jobs:
  scanner:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: apex_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      TEST_POSTGRES_DSN: postgresql://test:test@localhost:5432/apex_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas python-dotenv python-dateutil alpaca-trade-api finvizfinance scikit-learn psycopg2-binary
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile full_market_scan.py scan_audit.py scanner_engine.py research_orchestrator.py setup_memory.py apex_research_loop.py
