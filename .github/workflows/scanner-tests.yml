name: Scanner tests
on: [push, pull_request]
jobs:
  scanner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - run: pip install requests pandas python-dotenv python-dateutil alpaca-trade-api finvizfinance scikit-learn
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile full_market_scan.py scan_audit.py scanner_engine.py research_orchestrator.py setup_memory.py apex_research_loop.py
